<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A browser-based 3D editor for Minecraft Bedrock builders." />
    <title>Kigumi</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <section id="mobile-guidance" role="dialog" aria-modal="true" aria-labelledby="mobile-guidance-title" aria-describedby="mobile-guidance-description">
      <div class="mobile-guidance-card">
        <div class="mobile-guidance-mark" aria-hidden="true"></div>
        <p class="mobile-guidance-eyebrow">kigumi</p>
        <h1 id="mobile-guidance-title" data-i18n-text="mobile.title"></h1>
        <p id="mobile-guidance-description" data-i18n-text="mobile.description"></p>
        <p class="mobile-guidance-requirements" data-i18n-text="mobile.requirements"></p>
      </div>
    </section>
    <div id="app-grid">
      <nav id="sidebar-rail" data-i18n-aria="aria.rail"></nav>
      <aside id="sidebar-left"></aside>
      <div id="editor-area">
        <canvas id="viewport"></canvas>
      </div>
      <aside id="right-panel">
        <section id="world-controls" data-i18n-aria="aria.worldControls"></section>
        <div id="inspector"></div>
        <section id="block-usage" data-i18n-aria="aria.blockUsage"></section>
      </aside>
    </div>
    <nav id="toolbar" data-i18n-aria="aria.toolbar"></nav>
    <footer id="statusbar"></footer>
    <div id="help" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
