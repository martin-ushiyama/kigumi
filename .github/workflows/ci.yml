name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (lint / typecheck / unit / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: unit tests (with coverage)
        run: npm run test:coverage

      - name: build
        run: npm run build

      - name: bundle size budget
        run: npm run check:bundle-size

      # Regenerating the texture manifest cannot happen here. The manifest is a projection of the
      # unified DB, and the DB is built from a gitignored snapshot, so CI cannot rebuild it.
      # Regeneration runs in regen-from-upstream.yml (manual).
      #
      # What can be checked from committed files alone is covered by unit tests instead:
      #   - the catalog and the manifest hold the same set of IDs (tests/textures-manifest.test.ts)
      #   - the ledger (src/data/texture-ledger.json) agrees with the manifest (same file)
      #   - the projection rules themselves (tests/texture-manifest.test.ts, fixture based)

      # Neither the upstream snapshot nor the PNGs are committed, so all that is present here are
      # the committed artifacts (depth 0). That is enough to verify the structural agreement
      # between the manifest and the record — flipbook membership needs the snapshot, and
      # checking the real frame count needs the PNGs.
      - name: 'animated texture frame counts: structural check (depth 0 = committed only)'
        run: npm run gen-texture-frames:check

  public-repo:
    name: public repository rules (language / names / commit author)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so the commit range of the pull request is present locally. With the
      # default shallow clone the base commit is missing and the range cannot be resolved.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # The history guard runs the comment check over each commit, and that check parses with the
      # TypeScript compiler, so the dependencies have to be here.
      - run: npm ci

      - name: tracked files (document language / personal names)
        run: node scripts/public-repo-lint.mjs

      # Pushes are checked as well as pull requests. A merge or squash commit is created by the
      # server after the pull request was last checked, so it was never in that range — leaving
      # push out would let the commit that actually lands go unexamined.
      - name: commits (author / message language / personal names)
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          else
            # A branch that did not exist before this push has no "before" to compare against.
            # Fall back to the single commit at its head rather than walking the whole history.
            range="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          node scripts/public-repo-lint.mjs --commits "$range"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          ZERO_SHA: '0000000000000000000000000000000000000000'

      # The title and body are public from the moment the pull request opens, and on a squash
      # merge the title becomes the commit subject. They are passed through a file because the
      # text is arbitrary and multi-line; interpolating it into a command would let it run.
      - name: pull request title and body
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-text.txt"
          node scripts/public-repo-lint.mjs --text-file "$RUNNER_TEMP/pr-text.txt" --label 'the pull request text'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  e2e:
    name: e2e (Playwright/Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: build
        run: npm run build

      - name: e2e tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: upload trace/screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
